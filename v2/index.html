<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Insolvency Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Saira:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--board:#E9EDF0;--board-deep:#DDE3E8;--tarmac:#1B2129;--kerb:#56606B;--hairline:#1B21291F;--red:#E5322D;--green:#2DBE5A}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font-family:"Saira",system-ui,sans-serif;background:linear-gradient(180deg,var(--board) 0%,var(--board-deep) 100%);color:var(--kerb);display:flex;align-items:center;justify-content:center;padding:16px}
.card{background:#fff;border:1px solid var(--hairline);border-radius:10px;padding:32px 28px;width:100%;max-width:380px;box-shadow:0 12px 32px rgba(27,33,41,.08)}
h1{font-size:20px;font-weight:600;color:var(--tarmac);margin:0 0 4px;letter-spacing:.01em}
p.sub{margin:0 0 22px;font-size:14px}
label{display:block;font-size:13px;font-weight:500;color:var(--tarmac);margin-bottom:6px}
input[type=password]{width:100%;font:inherit;font-size:16px;padding:10px 12px;border:1px solid #c5ccd3;border-radius:6px;background:#fff;color:var(--tarmac);outline:none}
input[type=password]:focus{border-color:var(--tarmac);box-shadow:0 0 0 3px var(--hairline)}
.row{display:flex;align-items:center;gap:8px;margin:14px 0 18px;font-size:13px}
.row input{margin:0}
button{width:100%;font:inherit;font-size:15px;font-weight:600;padding:11px 16px;border:0;border-radius:999px;background:var(--tarmac);color:#F4F5F6;cursor:pointer}
button:disabled{opacity:.6;cursor:default}
.msg{min-height:20px;margin-top:12px;font-size:13px;color:var(--red)}
.foot{margin-top:18px;font-size:12px;color:#8A939C;border-top:1px solid var(--hairline);padding-top:12px}
</style>
</head>
<body>
<form class="card" id="f" autocomplete="off">
  <h1>Canada Insolvency Tracker</h1>
  <p class="sub">This page is encrypted. Enter the password to open it.</p>
  <label for="pw">Password</label>
  <input type="password" id="pw" autofocus autocomplete="current-password">
  <div class="row"><input type="checkbox" id="remember"><label for="remember" style="margin:0;font-weight:400;color:var(--kerb)">Remember on this device</label></div>
  <button type="submit" id="go">Open dashboard</button>
  <div class="msg" id="msg"></div>
  <div class="foot">Last updated 06 Nov 2026, 22:12 EST. Decryption happens in your browser; nothing is sent anywhere.</div>
</form>

var enc=new TextEncoder();
function b64(s){var b=atob(s),a=new Uint8Array(b.length);for(var i=0;i<b.length;i++)a[i]=b.charCodeAt(i);return a}
function tob64(a){var s="";for(var i=0;i<a.length;i++)s+=String.fromCharCode(a[i]);return btoa(s)}
async function keyFromPassword(pw){
  var base=await crypto.subtle.importKey("raw",enc.encode(pw),"PBKDF2",false,["deriveKey"]);
  return crypto.subtle.deriveKey({name:"PBKDF2",salt:b64(SALT),iterations:ITER,hash:"SHA-256"},base,{name:"AES-GCM",length:256},true,["decrypt"]);
}
async function open(key){
  var plain=await crypto.subtle.decrypt({name:"AES-GCM",iv:b64(IV)},key,b64(DATA));
  var ds=new DecompressionStream("gzip");
  var w=ds.writable.getWriter();w.write(new Uint8Array(plain));w.close();
  var html=await new Response(ds.readable).text();
  document.open();document.write(html);document.close();
}
function fail(t){document.getElementById("msg").textContent=t;document.getElementById("go").disabled=false;document.getElementById("pw").focus()}
document.getElementById("f").addEventListener("submit",async function(e){
  e.preventDefault();
  var btn=document.getElementById("go");btn.disabled=true;document.getElementById("msg").textContent="";
  var pw=document.getElementById("pw").value;
  try{
    var key=await keyFromPassword(pw);
    if(document.getElementById("remember").checked){
      try{localStorage.setItem(STORE,tob64(new Uint8Array(await crypto.subtle.exportKey("raw",key))))}catch(_){}
    }
    await open(key);
  }catch(err){fail("That password did not work.")}
});
(async function(){
  var saved=null;try{saved=localStorage.getItem(STORE)}catch(_){}
  if(!saved)return;
  try{
    var key=await crypto.subtle.importKey("raw",b64(saved),{name:"AES-GCM"},false,["decrypt"]);
    await open(key);
  }catch(_){try{localStorage.removeItem(STORE)}catch(__){}}
})();
})();
